# Rockchip RKNPU2 images only (see .devops/rknpu2.Dockerfile).
# Publishes linux/arm64 builds to ghcr.io when this branch is pushed.

name: Publish RKNPU2 Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - rknpu2 # change or extend if your RKNPU development uses another branch name

concurrency:
  group: docker-rknpu2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [full, light, server]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=ghcr.io/${owner_lc}/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: .devops/rknpu2.Dockerfile
          platforms: linux/arm64
          push: true
          target: ${{ matrix.target }}
          provenance: false
          tags: ${{ steps.meta.outputs.image_repo }}:${{ matrix.target }}-rknpu2
          cache-from: type=gha
          cache-to: type=gha,mode=max
